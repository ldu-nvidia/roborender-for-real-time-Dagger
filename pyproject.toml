[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roborender-round-dagger-core"
version = "0.1.0"
description = "Portable, fail-closed data and coordination core for RoboRender DAgger"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
train = ["torch>=2.2"]
yaml = ["PyYAML>=6.0"]
test = ["pytest>=8", "torch>=2.2", "PyYAML>=6.0"]

[tool.setuptools.packages.find]
include = ["round_dagger*", "integrations*", "scripts*"]
namespaces = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

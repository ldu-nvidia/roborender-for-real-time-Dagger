[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dagger-rtx-server"
version = "0.1.0"
description = "Fail-closed RTX transition owner for distributed RoboRender DAgger"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8.0", "jsonschema>=4.10"]

[tool.setuptools]
package-dir = {"" = "code/src"}

[tool.setuptools.packages.find]
where = ["code/src"]

[tool.pytest.ini_options]
pythonpath = ["code/src"]
testpaths = ["tests"]
addopts = "-ra"
